<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="旅行方案集：收录各个国家和地区的路线规划、交通、住宿、饮食与人文体验。">
  <meta property="og:title" content="旅行方案集 · Trip Atlas">
  <meta property="og:description" content="把每一次出发，整理成一份可以随时回看的路线。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://siche.github.io/trip/vn/assets/mu-cang-chai.jpg">
  <title>旅行方案集 · Trip Atlas</title>
  <style>
    :root {
      --paper: #f5f0e7;
      --paper-deep: #e9dfd0;
      --ink: #18302a;
      --muted: #6f746c;
      --accent: #c5573c;
      --line: rgba(24, 48, 42, 0.16);
      --card: rgba(255, 253, 247, 0.88);
      --shadow: 0 28px 70px rgba(42, 53, 47, 0.14);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(197, 87, 60, 0.12), transparent 26rem),
        linear-gradient(135deg, var(--paper), #f9f6ef 48%, var(--paper-deep));
      font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      min-height: 100vh;
    }

    a { color: inherit; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 14px;
    }

    .topbar nav a {
      color: var(--muted);
      font: 500 14px/1.4 system-ui, sans-serif;
      text-decoration: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: clamp(40px, 7vw, 96px);
      align-items: end;
      padding: clamp(72px, 11vw, 145px) 0 78px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent);
      font: 700 12px/1 system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(52px, 8.5vw, 112px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .94;
    }

    .hero-copy {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.9;
    }

    .hero-copy strong { color: var(--ink); font-weight: 600; }

    .destinations {
      padding: 40px 0 110px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 500;
      letter-spacing: -.03em;
    }

    .section-count {
      color: var(--muted);
      font: 500 13px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 22px;
    }

    .destination-card {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border-radius: 4px 34px 4px 4px;
      background: #314f43;
      box-shadow: var(--shadow);
      isolation: isolate;
      text-decoration: none;
    }

    .destination-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2,.7,.2,1);
      z-index: -2;
    }

    .destination-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 25, 21, 0.03) 20%, rgba(8, 25, 21, 0.88) 100%);
      z-index: -1;
    }

    .destination-card:hover img,
    .destination-card:focus-visible img { transform: scale(1.045); }

    .destination-card:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .card-content {
      position: absolute;
      inset: auto 0 0;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 26px;
      align-items: end;
      padding: clamp(28px, 5vw, 52px);
      color: #fffdf7;
    }

    .card-kicker {
      margin: 0 0 12px;
      font: 650 12px/1 system-ui, sans-serif;
      letter-spacing: .17em;
      text-transform: uppercase;
      opacity: .76;
    }

    .card-content h3 {
      margin: 0 0 11px;
      font-size: clamp(42px, 6vw, 76px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: 1;
    }

    .route {
      margin: 0;
      font: 450 14px/1.7 system-ui, sans-serif;
      opacity: .82;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      font: 300 28px/1 system-ui, sans-serif;
      transition: background .25s ease, color .25s ease;
    }

    .destination-card:hover .arrow {
      color: var(--ink);
      background: #fffdf7;
    }

    .future-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 4px 34px 4px 4px;
      background: var(--card);
    }

    .future-number {
      color: var(--accent);
      font: 600 13px/1 system-ui, sans-serif;
      letter-spacing: .14em;
    }

    .future-card h3 {
      margin: auto 0 16px;
      font-size: clamp(29px, 3vw, 42px);
      font-weight: 500;
      line-height: 1.15;
    }

    .future-card p {
      margin: 0;
      color: var(--muted);
      font: 450 15px/1.75 system-ui, sans-serif;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 30px 0 46px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 450 12px/1.6 system-ui, sans-serif;
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 1180px); }
      .hero { grid-template-columns: 1fr; padding-top: 74px; }
      .grid { grid-template-columns: 1fr; }
      .destination-card, .future-card { min-height: 430px; }
      .card-content { grid-template-columns: 1fr; }
      .arrow { width: 48px; height: 48px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .destination-card img { transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="旅行方案集主页">
        <span class="brand-mark" aria-hidden="true">行</span>
        <span>TRIP ATLAS</span>
      </a>
      <nav aria-label="主导航"><a href="#destinations">目的地方案</a></nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Curated travel plans</p>
          <h1 id="page-title">旅行<br>方案集</h1>
        </div>
        <p class="hero-copy">把每一次出发，整理成一份<strong>可以随时回看的路线</strong>。从交通与住宿，到风景、人文和餐桌，所有方案都从这里出发。</p>
      </section>

      <section class="destinations" id="destinations" aria-labelledby="destination-title">
        <div class="section-head">
          <h2 id="destination-title">目的地</h2>
          <span class="section-count">01 plan available</span>
        </div>

        <div class="grid">
          <!-- 新增国家时，可复制此入口卡片并将链接指向新的子文件夹。 -->
          <a class="destination-card" href="./vn/" aria-label="打开越南旅行指南">
            <img src="./vn/assets/mu-cang-chai.jpg" alt="越南木江界层叠的稻田与山谷">
            <div class="card-content">
              <div>
                <p class="card-kicker">2026.09.28 — 10.08 · 11 days</p>
                <h3>越南</h3>
                <p class="route">河内 · 宁平 · 木江界 · 胡志明市</p>
              </div>
              <span class="arrow" aria-hidden="true">→</span>
            </div>
          </a>

          <aside class="future-card" aria-label="未来旅行方案">
            <span class="future-number">02 — ∞</span>
            <div>
              <h3>下一站，<br>仍在路上</h3>
              <p>这里会继续收录其他国家和地区的旅行方案。每个目的地都将拥有独立页面，并从主页统一进入。</p>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer>
      <span>Trip Atlas · Personal travel archive</span>
      <span>路线会随新的出发持续更新</span>
    </footer>
  </div>
</body>
</html>
